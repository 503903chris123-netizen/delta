<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Bypass</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px; margin: 0 auto; padding: 24px 16px;
      background: #0f172a; color: #e2e8f0;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      padding: 8px 16px; border-radius: 8px; border: 1px solid #334155;
      background: transparent; color: #94a3b8; cursor: pointer; font-size: 14px;
    }
    .tab.active { background: #1e293b; color: #38bdf8; border-color: #38bdf8; }
    .panel { display: none; }
    .panel.active { display: block; }
    textarea, input[type="text"] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 14px; resize: vertical;
    }
    textarea { min-height: 90px; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: #38bdf8; color: #0f172a; font-weight: 600;
      cursor: pointer; font-size: 14px;
    }
    button.secondary { background: #334155; color: #e2e8f0; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #bypass-result, .result-box {
      margin-top: 14px; padding: 12px; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      white-space: pre-wrap; word-break: break-all; font-size: 13px; line-height: 1.6;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    hr { border: none; border-top: 1px solid #1e293b; margin: 24px 0; }
  </style>
</head>
<body>

  <h1>⚡ Delta Bypass</h1>
  <div class="sub">解指定链接 · 生成链接 · Bypass Linkvertise / Lootlabs</div>

  <div class="tabs">
    <button class="tab active" data-tab="solve">解指定</button>
    <button class="tab" data-tab="gen">生成链接</button>
    <button class="tab" data-tab="bypass">Bypass 链接</button>
  </div>

  <!-- 解指定（原有功能，保留） -->
  <div id="panel-solve" class="panel active">
    <textarea id="solve-input" placeholder="粘贴 auth 链接或 ticket"></textarea>
    <div class="row">
      <button id="btn-solve">解出 Key</button>
      <button class="secondary" id="btn-clear-solve">清空</button>
    </div>
    <div id="solve-result" class="result-box">还没有结果</div>
  </div>

  <!-- 生成链接（原有功能，保留） -->
  <div id="panel-gen" class="panel">
    <textarea id="gen-input" placeholder="粘贴 auth 链接或 ticket"></textarea>
    <div class="row">
      <button id="btn-gen">开始生成</button>
      <button class="secondary" id="btn-clear-gen">清空</button>
    </div>
    <div id="gen-result" class="result-box">还没有结果</div>
  </div>

  <!-- Bypass（新增） -->
  <div id="panel-bypass" class="panel">
    <input type="text" id="bypass-input" placeholder="粘贴 Linkvertise 或 Lootlabs 链接，自动识别">
    <div class="row">
      <button id="btn-bypass">开始 Bypass</button>
      <button class="secondary" id="btn-clear-bypass">清空</button>
    </div>
    <div id="bypass-result" class="result-box">等待输入链接…</div>
  </div>

  <script>
    // Tab 切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });

    // ===== Bypass 核心逻辑 =====
    const bypassInput = document.getElementById('bypass-input');
    const bypassResult = document.getElementById('bypass-result');
    const btnBypass = document.getElementById('btn-bypass');
    const btnClearBypass = document.getElementById('btn-clear-bypass');

    async function doBypass() {
      const url = bypassInput.value.trim();
      if (!url) {
        bypassResult.innerHTML = '<span class="err">请先粘贴一个链接。</span>';
        return;
      }

      bypassResult.textContent = '正在解析…';
      btnBypass.disabled = true;

      try {
        const res = await fetch('/api/bypass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        let data;
        try { data = await res.json(); } catch { data = null; }

        if (!res.ok) {
          const msg = data?.detail || data?.message || `请求失败（HTTP ${res.status}）`;
          bypassResult.innerHTML = `<span class="err">❌ ${msg}</span>`;
          return;
        }

        if (data.success && data.destination) {
          bypassResult.innerHTML =
            `<span class="ok">✅ 解析成功（${data.service}）</span>\n\n` +
            `目标网站：\n${data.destination}`;
        } else {
          bypassResult.innerHTML = `<span class="err">❌ ${data.message || '解析失败'}</span>`;
        }
      } catch (e) {
        bypassResult.innerHTML = `<span class="err">❌ 网络错误：${e.message}</span>`;
      } finally {
        btnBypass.disabled = false;
      }
    }

    btnBypass.addEventListener('click', doBypass);
    btnClearBypass.addEventListener('click', () => {
      bypassInput.value = '';
      bypassResult.textContent = '等待输入链接…';
    });

    // 回车即解析
    bypassInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doBypass();
      }
    });
  </script>

</body>
</html>
